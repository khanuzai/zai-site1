<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abdullah khan — homepage reference</title>
<!-- Design reference only. Fixed 1440x900 stage. Port this into the Next.js app as described in CLAUDE.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ebe5d8; display: flex; justify-content: center; }
  .stage { width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ebe5d8; color: #16130f; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; }
  .stage canvas { position: absolute; inset: 0; width: 1440px; height: 900px; pointer-events: none; }
  .stage a { color: #16130f; text-decoration: none; background-image: linear-gradient(#16130f, #16130f); background-repeat: no-repeat; background-position: 0 100%; background-size: 0 1.5px; transition: background-size .35s ease; }
  .stage a:hover, .stage a:focus-visible { background-size: 100% 1.5px; }
  .stage .soc { color: #5c554b; background-image: linear-gradient(#5c554b, #5c554b); }
  .nav { position: absolute; left: 120px; top: 42px; display: flex; gap: 30px; font-size: 16px; font-weight: 500; letter-spacing: 0.01em; }
  .hero { position: absolute; left: 120px; top: 250px; width: 600px; display: flex; flex-direction: column; gap: 18px; }
  .hero h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 132px; line-height: 0.84; letter-spacing: -0.03em; }
  .hero .ur { align-self: flex-start; font-family: 'Noto Nastaliq Urdu', serif; font-size: 28px; line-height: 2.1; color: #3d3831; }
  .hero p { margin: 0; font-size: 16px; line-height: 1.65; color: #3d3831; max-width: 440px; }
  .social { position: absolute; left: 120px; bottom: 46px; display: flex; gap: 24px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" width="1440" height="900" aria-hidden="true"></canvas>
  <nav class="nav" aria-label="Primary"><a href="#">work</a><a href="#">projects</a><a href="#">writing</a><a href="#">quotes</a><a href="#">contact</a></nav>
  <div class="hero">
    <h1>abdullah<br>khan</h1>
    <span class="ur" lang="ur" dir="rtl">عبداللہ خان</span>
    <p>builds things that feel like something.<br>cs at uwaterloo, bba at laurier.</p>
  </div>
  <nav class="social" aria-label="Social"><a class="soc" href="#">github</a><a class="soc" href="#">linkedin</a><a class="soc" href="#">x</a><a class="soc" href="#">email</a></nav>
</div>
<script>
(() => {
  const W = 1440, H = 900;
  const X0 = 800, X1 = 1400, Y0 = 40, Y1 = 860, GAP = 8;
  const moon = { x: 1170, y: 190, r: 86 };
  const slant = (x) => 540 - (x - X0) * (110 / (X1 - X0));
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };

  // value noise
  const NN = 256, tbl = new Float32Array(NN * NN);
  for (let i = 0; i < NN * NN; i++) tbl[i] = Math.random();
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), g = (a, b) => tbl[((a & 255) * NN) + (b & 255)];
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  let t = 0;

  // paper grain
  const paper = mk(), p = paper.getContext('2d');
  p.fillStyle = '#ebe5d8'; p.fillRect(0, 0, W, H);
  for (let i = 0; i < 9000; i++) { p.fillStyle = Math.random() < 0.5 ? 'rgba(90,78,60,0.05)' : 'rgba(255,255,255,0.25)'; p.fillRect(Math.random() * W, Math.random() * H, 1 + Math.random() * 2, 1); }

  // soft ink washes (inside panels only)
  const wash = mk(), w = wash.getContext('2d');
  [[1000, 420, 320, 0.22], [1300, 760, 300, 0.3], [880, 820, 220, 0.25]].forEach(([x, y, r, a]) => { const g = w.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(22,19,15,${a})`); g.addColorStop(1, 'rgba(22,19,15,0)'); w.fillStyle = g; w.fillRect(0, 0, W, H); });

  // crosshatch layer
  const ink = mk(), o = ink.getContext('2d');
  const density = (x, y) => {
    const n = noise(x * 0.005 + t * 0.002, y * 0.005) - 0.5;
    let d;
    if (y < slant(x)) {
      const dm = Math.hypot(x - moon.x, y - moon.y);
      d = 0.5 + (y - Y0) / 900 + n * 0.5;
      if (dm < moon.r) d = 0; else if (dm < moon.r + 60) d *= (dm - moon.r) / 60;
    } else d = 0.35 + (y - 500) / 500 + n * 0.6;
    return Math.max(0, Math.min(1, d));
  };
  const stroke = () => {
    const x = X0 + Math.random() * (X1 - X0), y = Y0 + Math.random() * (Y1 - Y0), d = density(x, y);
    if (Math.random() > d) return;
    const layer = d > 0.8 ? 2 : d > 0.45 ? 1 : 0;
    const ang = [Math.PI / 4, -Math.PI / 4, 0.1][Math.floor(Math.random() * (layer + 1))];
    const len = 12 + Math.random() * 40 * (0.5 + d), dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
    o.strokeStyle = `rgba(22,19,15,${(0.5 + Math.random() * 0.45).toFixed(2)})`;
    o.lineWidth = 0.6 + Math.random() * 0.9; o.lineCap = 'round';
    o.beginPath(); o.moveTo(x - dx, y - dy);
    o.quadraticCurveTo(x + (Math.random() - 0.5) * 3, y + (Math.random() - 0.5) * 3, x + dx, y + dy); o.stroke();
  };
  for (let i = 0; i < 16000; i++) stroke();

  // panels + hand-inked borders
  const panelPath = (ctx) => {
    ctx.beginPath();
    ctx.moveTo(X0, Y0); ctx.lineTo(X1, Y0); ctx.lineTo(X1, slant(X1) - GAP); ctx.lineTo(X0, slant(X0) - GAP); ctx.closePath();
    ctx.moveTo(X0, slant(X0) + GAP); ctx.lineTo(X1, slant(X1) + GAP); ctx.lineTo(X1, Y1); ctx.lineTo(X0, Y1); ctx.closePath();
  };
  const polys = [[[X0, Y0], [X1, Y0], [X1, slant(X1) - GAP], [X0, slant(X0) - GAP]], [[X0, slant(X0) + GAP], [X1, slant(X1) + GAP], [X1, Y1], [X0, Y1]]];
  const edges = [];
  polys.forEach(pl => { for (let pass = 0; pass < 2; pass++) { const pts = []; for (let i = 0; i < 4; i++) { const [ax, ay] = pl[i], [bx, by] = pl[(i + 1) % 4], len = Math.hypot(bx - ax, by - ay), n = Math.max(2, Math.floor(len / 14)), nx = -(by - ay) / len, ny = (bx - ax) / len; for (let k = 0; k < n; k++) { const tt = k / n, j = (Math.random() - 0.5) * (pass ? 1.6 : 1.1); pts.push([ax + (bx - ax) * tt + nx * j, ay + (by - ay) * tt + ny * j]); } } edges.push({ pts, w: pass ? 1.1 : 2.6 }); } });

  // bats (boids)
  const bats = [];
  for (let i = 0; i < 9; i++) bats.push({ x: 1080 + Math.random() * 200, y: 140 + Math.random() * 120, vx: -1 - Math.random(), vy: Math.random() - 0.5, ph: Math.floor(Math.random() * 10) });
  let mx = null, my = null;
  const stage = document.getElementById('stage');
  stage.addEventListener('mousemove', (e) => { const r = stage.getBoundingClientRect(), sc = r.width / W || 1; mx = (e.clientX - r.left) / sc; my = (e.clientY - r.top) / sc; });
  stage.addEventListener('mouseleave', () => { mx = null; my = null; });

  const step = () => {
    for (let i = 0; i < 40; i++) stroke();
    o.globalCompositeOperation = 'destination-out'; o.fillStyle = 'rgba(0,0,0,0.006)'; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    for (const b of bats) {
      let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
      for (const q of bats) {
        if (q === b) continue;
        const dx = q.x - b.x, dy = q.y - b.y, d = Math.hypot(dx, dy);
        if (d < 110) { ax += q.vx; ay += q.vy; cx += q.x; cy += q.y; n++; }
        if (d < 42 && d > 0) { sx -= dx / d; sy -= dy / d; }
      }
      if (n) { b.vx += (ax / n - b.vx) * 0.03 + (cx / n - b.x) * 0.0012; b.vy += (ay / n - b.vy) * 0.03 + (cy / n - b.y) * 0.0012; }
      b.vx += sx * 0.1 + (Math.random() - 0.5) * 0.08; b.vy += sy * 0.1 + (Math.random() - 0.5) * 0.08;
      if (mx !== null) { const dx = b.x - mx, dy = b.y - my, d = Math.hypot(dx, dy); if (d < 150 && d > 0) { const k = (1 - d / 150) * 0.8; b.vx += dx / d * k; b.vy += dy / d * k; } }
      if (b.y < 80) b.vy += 0.06; if (b.y > 780) b.vy -= 0.08; if (b.x < 760) b.vx += 0.03;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 2.8) { b.vx *= 2.8 / sp; b.vy *= 2.8 / sp; }
      if (sp < 1 && sp > 0) { b.vx /= sp; b.vy /= sp; }
      b.x += b.vx; b.y += b.vy;
      if (b.x > 1480) { b.x = 1440; b.vx = -Math.abs(b.vx); }
    }
  };

  const ctx = document.getElementById('cv').getContext('2d');
  const up = ['X.....X', 'XX.X.XX', '.XXXXX.', '...X...'], down = ['.......', '.X.X.X.', 'XXXXXXX', 'X..X..X'];
  const draw = () => {
    ctx.drawImage(paper, 0, 0);
    ctx.save(); panelPath(ctx); ctx.clip(); ctx.drawImage(wash, 0, 0); ctx.drawImage(ink, 0, 0); ctx.restore();
    ctx.strokeStyle = '#16130f'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    edges.forEach(e => { ctx.lineWidth = e.w; ctx.beginPath(); e.pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])); ctx.closePath(); ctx.stroke(); });
    const P = 4; ctx.fillStyle = '#16130f';
    bats.forEach(b => { const sh = Math.floor((t + b.ph) / 5) % 2 ? up : down; const bx = Math.round(b.x / P) * P, by = Math.round(b.y / P) * P; sh.forEach((row, ry) => { for (let rx = 0; rx < 7; rx++) if (row[rx] === 'X') ctx.fillRect(bx + rx * P, by + ry * P, P, P); }); });
  };

  draw();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => { t++; step(); draw(); }, 33);
})();
</script>
</body>
</html>
